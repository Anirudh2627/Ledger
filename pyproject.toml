[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "Ledger - regression testing and evaluation infrastructure for LLM applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ledger Maintainers" }]
keywords = [
    "llm",
    "evaluation",
    "regression-testing",
    "llm-as-a-judge",
    "ci-cd",
    "quality-gates",
    "mlops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
ledger = "ledger.cli.main:main"

[project.urls]
Documentation = "https://github.com/your-org/ledger/tree/main/docs"
Source = "https://github.com/your-org/ledger"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledger = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "SIM108", # ternary: not always clearer
    "SIM905", # str.split() for multi-word constant lists is more readable
    "B008",   # function call in default argument (typer pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "S101"]
"scripts/**" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "scripts", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
strict_equality = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

# Tests keep type checking but fixtures arrive dynamically from pytest, so
# unannotated fixture parameters are tolerated there.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Ledger has no class-based tests; avoid pytest trying to collect pydantic
# models named Test* (e.g. ledger.dataset.schema.TestCase).
python_classes = ["LedgerTestSuiteNeverMatches"]
markers = [
    "unit: fast, isolated tests",
    "integration: end-to-end pipeline tests (still fully offline via mock provider)",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ledger"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
