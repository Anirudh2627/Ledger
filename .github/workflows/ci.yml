name: CI

# Continuous integration: lint, format check, static types, unit + integration
# tests. Everything runs fully offline via the deterministic mock provider -
# no secrets required.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint / types / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff lint
        run: ruff check src tests scripts datasets

      - name: Ruff format check
        run: ruff format --check src tests scripts datasets

      - name: Mypy
        run: mypy

      - name: Pytest (with coverage)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  golden-dataset:
    name: Golden dataset validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Validate golden dataset (strict)
        run: ledger validate-dataset datasets/golden.jsonl --strict

      - name: Validate human labels load
        run: |
          python - <<'PY'
          from ledger.judges.calibration import load_human_labels
          labels = load_human_labels("datasets/human_labels.jsonl")
          print(f"human labels OK: {len(labels)} rows")
          PY
