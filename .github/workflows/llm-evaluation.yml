name: LLM Evaluation Gate

# -----------------------------------------------------------------------------
# Regression gate for changes that can alter model behavior:
# prompts, retrieval settings, evaluation configs, the golden dataset, or the
# sample SUT. Runs baseline vs candidate evaluations and BLOCKS the merge when
# the regression policy says FAIL.
#
# Provider modes:
#   * default          - deterministic MOCK providers (offline, free, reproducible)
#   * real LLM         - triggered manually (workflow_dispatch) or on schedule
#                        when OPENAI-compatible secrets are configured.
#
# Exit-code contract of `scripts/ci/gate.sh` (wraps `ledger gate`):
#   0 = PASS or WARNING, 1 = FAIL or WARNING with --fail-on-warning
#   3 = usage/config/dataset error
# -----------------------------------------------------------------------------
on:
  pull_request:
    paths:
      - "configs/**"
      - "datasets/**"
      - "data/**"
      - "src/ledger/systems/**"
      - "src/ledger/judges/prompts.py"
      - ".github/workflows/llm-evaluation.yml"
  workflow_dispatch:
    inputs:
      baseline_config:
        description: Baseline config file
        default: configs/baseline.yaml
        type: string
      candidate_config:
        description: Candidate config file
        default: configs/candidate.yaml
        type: string
      use_real_provider:
        description: Use the real LLM provider from repository secrets
        default: false
        type: boolean
      limit:
        description: Max test cases (empty = all)
        default: ""
        type: string
  # Optional nightly gate against main with real providers (only runs when
  # secrets exist; otherwise the mock path executes and costs nothing).
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

concurrency:
  group: llm-eval-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  evaluation-gate:
    name: Baseline vs candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Fast checks (lint + unit tests)
        run: |
          ruff check src tests scripts datasets
          pytest -m unit -q

      - name: Resolve provider mode
        id: mode
        env:
          USE_REAL: ${{ inputs.use_real_provider }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_PROVIDER_KEY: ${{ secrets.LEDGER_PROVIDER_API_KEY != '' }}
          HAS_PROVIDER_URL: ${{ secrets.LEDGER_PROVIDER_BASE_URL != '' }}
          HAS_PROVIDER_MODEL: ${{ secrets.LEDGER_PROVIDER_MODEL != '' }}
          HAS_JUDGE_KEY: ${{ secrets.LEDGER_JUDGE_API_KEY != '' }}
          HAS_JUDGE_URL: ${{ secrets.LEDGER_JUDGE_BASE_URL != '' }}
          HAS_JUDGE_MODEL: ${{ secrets.LEDGER_JUDGE_MODEL != '' }}
        run: |
          WANT_REAL="${USE_REAL:-false}"
          if [[ "$EVENT_NAME" == "schedule" ]]; then WANT_REAL="true"; fi
          if [[ "$WANT_REAL" == "true" \
            && "$HAS_PROVIDER_KEY" == "true" && "$HAS_PROVIDER_URL" == "true" \
            && "$HAS_PROVIDER_MODEL" == "true" && "$HAS_JUDGE_KEY" == "true" \
            && "$HAS_JUDGE_URL" == "true" && "$HAS_JUDGE_MODEL" == "true" ]]; then
            echo "mock=0" >> "$GITHUB_OUTPUT"
            echo "provider_name=openai_compat" >> "$GITHUB_OUTPUT"
            echo "judge_name=openai_compat" >> "$GITHUB_OUTPUT"
            echo "Real-provider mode: evaluations will call the configured API."
          else
            echo "mock=1" >> "$GITHUB_OUTPUT"
            echo "provider_name=mock" >> "$GITHUB_OUTPUT"
            echo "judge_name=mock" >> "$GITHUB_OUTPUT"
            if [[ "$WANT_REAL" == "true" ]]; then
              echo "Real mode requires SUT and judge API keys, base URLs, and model IDs; using mock mode."
            else
              echo "Mock mode: deterministic offline evaluation."
            fi
          fi

      - name: Resolve configs
        id: cfg
        env:
          BASELINE_CONFIG_INPUT: ${{ inputs.baseline_config }}
          CANDIDATE_CONFIG_INPUT: ${{ inputs.candidate_config }}
          LIMIT_INPUT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          for value in "$BASELINE_CONFIG_INPUT" "$CANDIDATE_CONFIG_INPUT" "$LIMIT_INPUT"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Workflow inputs must not contain line breaks." >&2
              exit 3
            fi
          done
          baseline="${BASELINE_CONFIG_INPUT:-configs/baseline.yaml}"
          candidate="${CANDIDATE_CONFIG_INPUT:-configs/candidate.yaml}"
          limit="$LIMIT_INPUT"
          if [[ ! -f "$baseline" || ! -f "$candidate" ]]; then
            echo "Both config inputs must name existing files in the workspace." >&2
            exit 3
          fi
          workspace_root="$(realpath "$GITHUB_WORKSPACE")"
          baseline_path="$(realpath -e -- "$baseline")"
          candidate_path="$(realpath -e -- "$candidate")"
          case "$baseline_path" in
            "$workspace_root"/*) baseline="${baseline_path#"$workspace_root"/}" ;;
            *) echo "Baseline config must be inside the workspace." >&2; exit 3 ;;
          esac
          case "$candidate_path" in
            "$workspace_root"/*) candidate="${candidate_path#"$workspace_root"/}" ;;
            *) echo "Candidate config must be inside the workspace." >&2; exit 3 ;;
          esac
          if [[ -n "$limit" && ! "$limit" =~ ^[1-9][0-9]*$ ]]; then
            echo "The evaluation limit must be a positive integer." >&2
            exit 3
          fi
          printf 'baseline=%s\ncandidate=%s\nlimit=%s\n' \
            "$baseline" "$candidate" "$limit" >> "$GITHUB_OUTPUT"

      # Baseline runs are cacheable: same config + same dataset + same code =>
      # same results in mock mode. Real-provider mode skips the cache because
      # model behavior can drift server-side.
      - name: Cache baseline run (mock mode only)
        if: steps.mode.outputs.mock == '1'
        id: baseline-cache
        uses: actions/cache@v4
        with:
          path: results/baseline-cache
          key: >-
            ledger-baseline-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
            limit-${{ steps.cfg.outputs.limit || 'all' }}-
            ${{ hashFiles(steps.cfg.outputs.baseline, 'configs/**', 'datasets/golden.jsonl',
                        'data/corpus/**', 'src/ledger/**',
                        'requirements.txt') }}

      - name: Evaluate baseline
        env:
          LEDGER_PROVIDER_API_KEY: ${{ secrets.LEDGER_PROVIDER_API_KEY }}
          LEDGER_PROVIDER_BASE_URL: ${{ secrets.LEDGER_PROVIDER_BASE_URL }}
          LEDGER_PROVIDER_MODEL: ${{ secrets.LEDGER_PROVIDER_MODEL }}
          LEDGER_JUDGE_API_KEY: ${{ secrets.LEDGER_JUDGE_API_KEY }}
          LEDGER_JUDGE_BASE_URL: ${{ secrets.LEDGER_JUDGE_BASE_URL }}
          LEDGER_JUDGE_MODEL: ${{ secrets.LEDGER_JUDGE_MODEL }}
          LEDGER_PROVIDER_NAME: ${{ steps.mode.outputs.provider_name }}
          LEDGER_JUDGE_NAME: ${{ steps.mode.outputs.judge_name }}
          MOCK_MODE: ${{ steps.mode.outputs.mock }}
          BASELINE_CONFIG: ${{ steps.cfg.outputs.baseline }}
          EVAL_LIMIT: ${{ steps.cfg.outputs.limit }}
        run: |
          set -euo pipefail
          mock_flags=()
          if [[ "$MOCK_MODE" == "1" ]]; then mock_flags=(--mock); fi
          limit_flags=()
          if [[ -n "$EVAL_LIMIT" ]]; then limit_flags=(--limit "$EVAL_LIMIT"); fi
          CACHE_DIR="results/baseline-cache"
          if [[ "$MOCK_MODE" == "1" && -f "$CACHE_DIR/summary.json" ]]; then
            echo "Reusing cached baseline run from $CACHE_DIR"
          else
            ledger evaluate --config "$BASELINE_CONFIG" --run-id baseline-cache \
              "${limit_flags[@]}" "${mock_flags[@]}"
          fi

      - name: Evaluate candidate
        env:
          LEDGER_PROVIDER_API_KEY: ${{ secrets.LEDGER_PROVIDER_API_KEY }}
          LEDGER_PROVIDER_BASE_URL: ${{ secrets.LEDGER_PROVIDER_BASE_URL }}
          LEDGER_PROVIDER_MODEL: ${{ secrets.LEDGER_PROVIDER_MODEL }}
          LEDGER_JUDGE_API_KEY: ${{ secrets.LEDGER_JUDGE_API_KEY }}
          LEDGER_JUDGE_BASE_URL: ${{ secrets.LEDGER_JUDGE_BASE_URL }}
          LEDGER_JUDGE_MODEL: ${{ secrets.LEDGER_JUDGE_MODEL }}
          LEDGER_PROVIDER_NAME: ${{ steps.mode.outputs.provider_name }}
          LEDGER_JUDGE_NAME: ${{ steps.mode.outputs.judge_name }}
          MOCK_MODE: ${{ steps.mode.outputs.mock }}
          CANDIDATE_CONFIG: ${{ steps.cfg.outputs.candidate }}
          EVAL_LIMIT: ${{ steps.cfg.outputs.limit }}
        run: |
          set -euo pipefail
          mock_flags=()
          if [[ "$MOCK_MODE" == "1" ]]; then mock_flags=(--mock); fi
          limit_flags=()
          if [[ -n "$EVAL_LIMIT" ]]; then limit_flags=(--limit "$EVAL_LIMIT"); fi
          ledger evaluate --config "$CANDIDATE_CONFIG" \
            --run-id candidate-current "${limit_flags[@]}" "${mock_flags[@]}"

      - name: Regression gate (baseline vs candidate)
        id: gate
        env:
          REPORTS_DIR: reports
        run: |
          scripts/ci/gate.sh \
            --baseline baseline-cache \
            --candidate candidate-current \
            --policy configs/policy.yaml

      - name: Publish report to job summary
        if: always()
        run: |
          latest="$(ls -t reports/comparison_*.md 2>/dev/null | head -n 1 || true)"
          if [ -n "$latest" ]; then
            {
              echo "## Ledger Evaluation Gate"
              echo ""
              cat "$latest"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-evaluation-artifacts
          path: |
            reports/
            results/*/summary.json
            results/*/results.jsonl
            experiments/index.jsonl
          if-no-files-found: warn
          retention-days: 30
